[package]
name = "kopi-desktop"
description = "Kopi's Tauri app shell: commands, events, windows, tray and hotkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "kopi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kopi-core.workspace = true
kopi-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
# macos-private-api: a transparent panel window, for its rounded corners.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
] }
tauri-nspanel = "2.1"

[lints]
workspace = true
