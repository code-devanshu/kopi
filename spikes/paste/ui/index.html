<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kopi paste spike</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: transparent; font: 13px -apple-system, system-ui, sans-serif; }
    .panel {
      box-sizing: border-box; height: 100%; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 12px; background: Canvas; color: CanvasText;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    }
    input {
      font: inherit; font-size: 17px; padding: 14px 16px; border: 0; outline: none;
      background: transparent; color: inherit;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    }
    ul { list-style: none; margin: 0; padding: 6px; flex: 1; overflow: auto; }
    li { padding: 8px 10px; border-radius: 6px; }
    li.sel { background: AccentColor; color: AccentColorText; }
    footer {
      padding: 8px 14px; font: 11px ui-monospace, monospace; opacity: 0.75;
      border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    }
  </style>
</head>
<body>
  <div class="panel">
    <input id="q" placeholder="↑↓ choose, Return pastes, Esc closes" autocomplete="off" spellcheck="false">
    <ul id="list"></ul>
    <footer>Return pastes the selected clip into the app you were using.</footer>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const q = document.getElementById('q');
    const list = document.getElementById('list');

    let items = [], sel = 0;

    function render() {
      list.innerHTML = '';
      items.forEach((text, i) => {
        const li = document.createElement('li');
        li.textContent = `${i + 1}. ${text}`;
        if (i === sel) li.className = 'sel';
        list.appendChild(li);
      });
    }

    listen('panel-shown', () => {
      q.value = '';
      sel = 0;
      q.focus();
      render();
    });

    document.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return; // the IME owns this key
      if (e.key === 'Escape') {
        e.preventDefault();
        invoke('hide', { reason: 'esc' });
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
        render();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        invoke('pick', { index: sel });
      }
    });

    invoke('clip_labels').then((labels) => { items = labels; render(); });
    invoke('js_log', { msg: 'page loaded' });
  </script>
</body>
</html>
