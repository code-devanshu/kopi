<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kopi panel spike</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: transparent; font: 13px -apple-system, system-ui, sans-serif; }
    .panel {
      box-sizing: border-box; height: 100%; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 12px; background: Canvas; color: CanvasText;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    }
    input {
      font: inherit; font-size: 17px; padding: 14px 16px; border: 0; outline: none;
      background: transparent; color: inherit;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    }
    ul { list-style: none; margin: 0; padding: 6px; flex: 1; overflow: auto; }
    li { padding: 8px 10px; border-radius: 6px; }
    li.sel { background: AccentColor; color: AccentColorText; }
    footer {
      padding: 8px 14px; font: 11px ui-monospace, monospace; opacity: 0.75; white-space: pre-wrap;
      border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    }
  </style>
</head>
<body>
  <div class="panel">
    <input id="q" placeholder="Type here. Esc hides, ↑↓ move, Return picks" autocomplete="off" spellcheck="false">
    <ul id="list"></ul>
    <footer id="status">waiting for ⇧⌘V</footer>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const q = document.getElementById('q');
    const list = document.getElementById('list');
    const status = document.getElementById('status');

    const items = ['First clip', 'Second clip', 'A link', 'Some code', 'An address', 'A long note'];
    let sel = 0, seq = 0, composing = false, lastKey = '-';

    function log(msg) { invoke('js_log', { msg }).catch(() => {}); }
    function tag(el) { return el ? el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') : 'null'; }
    // Only key names are logged, never typed characters.
    function keyName(e) { return e.key.length === 1 ? 'char' : e.key; }

    function render() {
      list.innerHTML = '';
      items.forEach((text, i) => {
        const li = document.createElement('li');
        li.textContent = `${i + 1}. ${text}`;
        if (i === sel) li.className = 'sel';
        list.appendChild(li);
      });
      status.textContent =
        `show #${seq}  hasFocus=${document.hasFocus()}  active=${tag(document.activeElement)}\n` +
        `last key=${lastKey}  composing=${composing}  input length=${q.value.length}`;
    }

    listen('panel-shown', (e) => {
      seq = e.payload;
      const before = `hasFocus=${document.hasFocus()} active=${tag(document.activeElement)}`;
      q.value = '';
      sel = 0;
      q.focus();
      const after = `hasFocus=${document.hasFocus()} active=${tag(document.activeElement)}`;
      render();
      requestAnimationFrame(() => {
        log(`panel-shown #${seq}: before focus() ${before}; after focus() ${after}; next frame hasFocus=${document.hasFocus()}`);
        render();
      });
    });

    window.addEventListener('focus', () => { log('window focus'); render(); });
    window.addEventListener('blur', () => { log('window blur'); render(); });
    q.addEventListener('input', render);
    q.addEventListener('compositionstart', () => { composing = true; log('compositionstart'); render(); });
    q.addEventListener('compositionupdate', (e) => log(`compositionupdate (${e.data.length} chars)`));
    q.addEventListener('compositionend', (e) => { composing = false; log(`compositionend (${e.data.length} chars committed)`); render(); });

    document.addEventListener('keydown', (e) => {
      lastKey = keyName(e) + (e.metaKey ? ' +cmd' : '');
      log(`keydown ${lastKey} code=${e.code} isComposing=${e.isComposing} keyCode=${e.keyCode}`);
      if (e.isComposing || e.keyCode === 229) { render(); return; } // the IME owns this key
      if (e.key === 'Escape') {
        e.preventDefault();
        invoke('hide', { reason: 'esc' });
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      } else if (e.key === 'Enter') {
        e.preventDefault();
        log(`return on item ${sel + 1}`);
        invoke('hide', { reason: 'return' });
      }
      render();
    });

    render();
    log('page loaded');
  </script>
</body>
</html>
