name: Bug report
description: Something isn't working as expected.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Found a security problem?** Don't file it here. Follow [SECURITY.md](https://github.com/code-devanshu/kopi/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: area
    attributes:
      label: Where is the bug?
      options:
        - Website (kopi.devanshuverma.in)
        - Desktop app
        - Docs
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots or a short recording help a lot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and version, plus browser and version for website bugs.
      placeholder: macOS 26.1, Safari 26 / Windows 11 24H2, Chrome 141
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, console errors or other context. Remove anything private, such as clipboard contents.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
