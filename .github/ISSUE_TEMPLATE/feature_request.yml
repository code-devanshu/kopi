name: Feature request
description: Suggest an idea or improvement for Kopi.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For open-ended ideas that need discussion first, [start a discussion](https://github.com/code-devanshu/kopi/discussions) instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: When I copy several things in a row, I ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature. Sketches or mockups are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve it, or how you handle it today.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Both macOS and Windows
        - macOS only
        - Windows only
        - Website
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Want to help?
      options:
        - label: I'd like to help design or build this.
