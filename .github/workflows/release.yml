name: Release

# Builds a universal macOS .dmg and the update the in-app updater installs. A version tag
# (v0.1.0, or v0.1.0-alpha.1 for a prerelease) attaches them to a draft GitHub Release, with the
# latest.json that the Updater workflow publishes once the release is. A manual run only keeps
# them as a workflow artifact. Releases are signed with a self-signed certificate and aren't
# notarized. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: Build universal .dmg
    runs-on: macos-latest
    permissions:
      # Creates the draft release.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # No Rust cache: release builds start clean.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Check the version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          crate=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "kopi-desktop") | .version')
          if [ "$crate" != "$version" ]; then
            echo "::error::apps/desktop/package.json is $version but Cargo.toml is $crate."
            exit 1
          fi
          name=$version
          prerelease=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") ;;
              "v$version"-*) prerelease=true ;;
              *)
                echo "::error::The tag $GITHUB_REF_NAME doesn't match the app version $version."
                exit 1
                ;;
            esac
            name=${GITHUB_REF_NAME#v}
          else
            name=$version-dev.$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Kopi isn't in the Apple Developer Program, so it's signed with a self-signed certificate
      # and isn't notarized. The certificate gives every build the same designated requirement,
      # which macOS ties permissions to, so testers keep them across updates.
      - name: Import the signing certificate
        id: signing
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERTIFICATE" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::A release needs the SIGNING_CERTIFICATE secret, or testers lose their permissions on every update."
              exit 1
            fi
            echo "::warning::No signing certificate, so this build is signed ad hoc. Testers lose their permissions when they update to it."
            echo "signing=ad-hoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tauri's own APPLE_CERTIFICATE import only finds Apple-issued certificates, so import it
          # here. codesign finds the identity through the keychain search list.
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<< "$SIGNING_CERTIFICATE" > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # The certificate isn't trusted, so it isn't a "valid" identity, but codesign still uses it.
          identity=$(security find-identity -p codesigning "$keychain" | grep -m1 -oE '[0-9A-F]{40}' || true)
          if [ -z "$identity" ]; then
            echo "::error::SIGNING_CERTIFICATE has no code-signing identity."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signing=self-signed" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          # Signs the update, which the app checks against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Without an identity, Tauri signs ad hoc ("-" in tauri.conf.json).
          [ -n "$APPLE_SIGNING_IDENTITY" ] || unset APPLE_SIGNING_IDENTITY

          updater=true
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::A release needs the TAURI_SIGNING_PRIVATE_KEY secret, or testers can't update to it from the app."
              exit 1
            fi
            echo "::warning::No updater key, so this build has no update for the app to install."
            updater=false
          fi
          echo "updater=$updater" >> "$GITHUB_OUTPUT"

          # CFBundleVersion goes up with every run, so each build is newer than the last, to macOS
          # and to the updater, even when the version stays the same.
          pnpm --filter @kopi/desktop tauri build --target universal-apple-darwin --bundles app,dmg \
            --config "{\"bundle\":{\"createUpdaterArtifacts\":$updater,\"macOS\":{\"bundleVersion\":\"$GITHUB_RUN_NUMBER\"}}}"

      - name: Check the build
        id: check
        env:
          SIGNING: ${{ steps.signing.outputs.signing }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
          UPDATER: ${{ steps.build.outputs.updater }}
        run: |
          mkdir dist
          bundle=target/universal-apple-darwin/release/bundle
          dmg=dist/Kopi_${NAME}_universal.dmg
          mv "$bundle"/dmg/*.dmg "$dmg"
          if [ "$UPDATER" = true ]; then
            mv "$bundle/macos/Kopi.app.tar.gz" "dist/Kopi_${NAME}_universal.app.tar.gz"
            mv "$bundle/macos/Kopi.app.tar.gz.sig" "dist/Kopi_${NAME}_universal.app.tar.gz.sig"
          fi

          # Checks the app in the .dmg, as testers get it.
          volume=$(mktemp -d)
          hdiutil attach "$dmg" -quiet -readonly -nobrowse -mountpoint "$volume"
          trap 'hdiutil detach "$volume"' EXIT
          app=$volume/Kopi.app
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          archs=" $(lipo -archs "$app/Contents/MacOS/$executable") "
          echo "Architectures:$archs"
          if [[ "$archs" != *" arm64 "* || "$archs" != *" x86_64 "* ]]; then
            echo "::error::Kopi.app isn't universal."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')
          echo "Designated requirement: $requirement"
          # Permissions follow the designated requirement, so it has to name the certificate.
          if [ "$SIGNING" = self-signed ] \
            && [[ "$requirement" != *"certificate leaf = H\"$(tr A-F a-f <<< "$IDENTITY")\""* ]]; then
            echo "::error::The designated requirement doesn't name the signing certificate."
            exit 1
          fi

          (cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

          # What the app reads to find this update, once the release is published. The app
          # compares the version, then the build number: every alpha of a version has the same
          # version. "version" must match the one the update was signed for.
          if [ "$UPDATER" = true ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            update=Kopi_${NAME}_universal.app.tar.gz
            jq -n \
              --arg version "$VERSION" \
              --argjson build "$GITHUB_RUN_NUMBER" \
              --arg release "$NAME" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$update" \
              --arg signature "$(cat "dist/$update.sig")" \
              '{version: $version, build: $build, release: $release, pub_date: $date,
                platforms: {
                  "darwin-aarch64": {url: $url, signature: $signature},
                  "darwin-x86_64": {url: $url, signature: $signature}
                }}' > dist/latest.json
            cat dist/latest.json
          fi

          {
            echo "### Kopi $NAME"
            echo
            echo "- Signing: **$SIGNING**"
            echo "- Designated requirement: \`$requirement\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$dmg.sha256")\`"
            echo "- Update for the app: **$([ "$UPDATER" = true ] && echo signed || echo none)**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Kopi_${{ steps.version.outputs.name }}_universal
          path: dist/
          retention-days: 14

      - name: Attach to a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DMG: ${{ steps.check.outputs.dmg }}
        run: |
          files=("$DMG" "$DMG.sha256" dist/*.app.tar.gz dist/*.app.tar.gz.sig dist/latest.json)

          # A rerun replaces the files on the release the first run made.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            exit 0
          fi

          install="https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/INSTALL_ALPHA.md"
          {
            echo "Download \`$(basename "$DMG")\`. It runs on Apple silicon and Intel Macs with macOS 14 or later."
            echo
            echo "> [!IMPORTANT]"
            echo "> Kopi isn't notarized by Apple, so macOS blocks it the first time you open it. [Installing Kopi]($install) shows how to open it and allow its permissions."
          } > notes.md

          flags=(--draft --verify-tag --title "Kopi $NAME" --notes-file notes.md --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "${files[@]}" "${flags[@]}"
