name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job below runs only when something it checks changed, so a docs-only change doesn't
  # build the app on three systems. A change to this file or to the shared package files runs
  # them all, and so does anything this can't work out.
  changes:
    name: Find what changed
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          # The PR's base, or main before the push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! files=$(git diff --name-only "$BASE...HEAD" 2>/dev/null); then
            echo "Couldn't diff against $BASE, so everything runs."
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Changed:\n%s\n' "$files"
          shared='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/ci\.yml)$'
          matches() { grep -qE "$1|$shared" <<< "$files" && echo true || echo false; }
          echo "web=$(matches '^apps/web/')" >> "$GITHUB_OUTPUT"
          echo "desktop=$(matches '^(apps/desktop/|crates/|Cargo\.(toml|lock)$|rust-toolchain)')" >> "$GITHUB_OUTPUT"

  web:
    name: Lint and build website
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kopi/web lint

      - run: pnpm build:web

  desktop:
    name: Check and build desktop app on macOS
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Also regenerates apps/desktop/src/lib/bindings.ts from the Rust commands.
      - run: cargo test --workspace --locked

      - name: Check the TypeScript bindings are up to date
        run: git diff --exit-code -- apps/desktop/src/lib/bindings.ts

      - run: pnpm --filter @kopi/desktop lint

      - run: pnpm --filter @kopi/desktop test

      # An ad-hoc-signed .app only. Release builds are in release.yml.
      - run: pnpm build:desktop

  desktop-windows:
    name: Check and build desktop app on Windows
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Formatting, the bindings and the UI don't depend on the OS, so the macOS job covers them.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

      # An unsigned installer, to check it builds. Release builds are in release.yml.
      - run: pnpm --filter @kopi/desktop tauri build --bundles nsis
