name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint and build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Uses the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kopi/web lint

      - run: pnpm build:web

  desktop:
    name: Check and build desktop app on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Also regenerates apps/desktop/src/lib/bindings.ts from the Rust commands.
      - run: cargo test --workspace --locked

      - name: Check the TypeScript bindings are up to date
        run: git diff --exit-code -- apps/desktop/src/lib/bindings.ts

      - run: pnpm --filter @kopi/desktop lint

      - run: pnpm --filter @kopi/desktop test

      # An ad-hoc-signed .app only. Release builds are in release.yml.
      - run: pnpm build:desktop

  desktop-windows:
    name: Check and build desktop app on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Formatting, the bindings and the UI don't depend on the OS, so the macOS job covers them.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

      # An unsigned installer, to check it builds. Release builds are in release.yml.
      - run: pnpm --filter @kopi/desktop tauri build --bundles nsis
