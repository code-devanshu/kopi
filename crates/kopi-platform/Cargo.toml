[package]
name = "kopi-platform"
description = "OS APIs behind small traits: the pasteboard, the frontmost app, key events, permissions and text recognition."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFData",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSProcessInfo",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNTypes",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Bitmaps on the clipboard become PNG, and PNG goes back as a bitmap too.
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "macos_pasteboard"
harness = false

[lints]
workspace = true
