[package]
name = "kopi-core"
description = "Kopi's core: watcher, privacy filter, classifier, storage, search, paste engine, settings and retention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kopi-platform.workspace = true
blake3 = "1.8"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "bmp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json.workspace = true
thiserror = "2"
uuid = { version = "1.28", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
